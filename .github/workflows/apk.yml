name: Build APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Endereço https do seu servidor Minicord (ex: https://meu-minicord.trycloudflare.com)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Gerar capacitor.config.json
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          node -e '
            const url = process.env.SERVER_URL.trim().replace(/\/+$/, "");
            const cfg = {
              appId: "com.minicord.app",
              appName: "Minicord",
              webDir: "www",
              server: { url, cleartext: url.startsWith("http://") },
              android: { allowMixedContent: false }
            };
            require("fs").writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
          cat capacitor.config.json

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Permissões de microfone e áudio
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$M"
          grep -n "uses-permission" "$M"

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: minicord-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
